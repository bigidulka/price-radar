[project]
name = "price-radar"
version = "0.1.0"
description = "Competitor price monitoring and repricing for marketplace sellers: Telegram bot, web dashboard, Excel export"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.13",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "httpx>=0.27",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
ozon = ["ozon-client @ git+https://github.com/bigidulka/ozon-client.git"]
dev = ["pytest>=8"]

[project.scripts]
price-radar = "price_radar.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
price_radar = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
